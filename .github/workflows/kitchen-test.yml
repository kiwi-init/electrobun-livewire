name: Kitchen test

on:
  workflow_dispatch:
    inputs:
      test:
        description: Kitchen test name, as given to defineTest
        type: string
        required: true
      runner:
        description: Runner
        type: choice
        default: ubuntu-24.04
        options:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-14

permissions:
  contents: read

jobs:
  kitchen:
    name: ${{ inputs.test }} (${{ inputs.runner }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    env:
      AUTO_RUN_TEST_NAME: ${{ inputs.test }}
      ELECTROBUN_KITCHEN_MAIN_PROCESS: bun
      ELECTROBUN_KITCHEN_RENDERER: native
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
      - uses: ./.github/actions/install-hutch
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libpipewire-0.3-dev build-essential cmake pkg-config xvfb xauth openbox dbus-x11
      - name: Build the devkit
        working-directory: package
        run: |
          hutch run install
          hutch build:dev
      - name: Install Kitchen
        working-directory: kitchen
        run: hutch run install
      - name: Run the test (Linux, Xvfb + openbox)
        if: runner.os == 'Linux'
        working-directory: kitchen
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: |
          export HUTCH_ELECTROBUN_DEVKIT_ROOT="$GITHUB_WORKSPACE/package/dist"
          dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24' bash -e -c 'openbox > /dev/null 2>&1 & hutch electrobun dev'
      - name: Run the test (macOS)
        if: runner.os == 'macOS'
        working-directory: kitchen
        run: HUTCH_ELECTROBUN_DEVKIT_ROOT="$GITHUB_WORKSPACE/package/dist" hutch electrobun dev
