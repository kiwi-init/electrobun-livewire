name: Kitchen test

on:
  workflow_dispatch:
    inputs:
      test:
        description: Kitchen test name, as given to defineTest, or "all" for every automated test
        type: string
        required: true
      runner:
        description: Runner
        type: choice
        default: ubuntu-24.04
        options:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
      appearance:
        description: System appearance (macOS)
        type: choice
        default: light
        options:
          - light
          - dark
      background:
        description: macOS only. "yes" runs in background mode, as on a developer's Mac, and fails if the frontmost app or the cursor changes; "control" watches the same way in the foreground, and fails if nothing changed (checks the watcher sees it)
        type: choice
        default: "no"
        options:
          - "no"
          - "yes"
          - control
      reduce_transparency:
        description: Reduce transparency (macOS); GitHub's images turn it on, which draws vibrancy as a flat color
        type: choice
        default: keep
        options:
          - keep
          - "off"
      strip:
        description: Linux only. Strip the devkit's ELF files as a release does (package-release.js), to test stripped binaries
        type: choice
        default: "no"
        options:
          - "no"
          - "yes"
      display:
        description: Linux display server (ignored on macOS)
        type: choice
        default: x11
        options:
          - x11
          - wayland
      compositor:
        description: Wayland compositor (with display=wayland)
        type: choice
        default: sway
        options:
          - sway
          - labwc
      scale:
        description: Output scale for the Wayland session (e.g. 1, 1.5, 2)
        type: string
        default: '1'
      env:
        description: Extra environment for the app, space-separated KEY=VALUE (e.g. ELECTROBUN_WAYLAND_CSD=1)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  kitchen:
    name: ${{ inputs.test }} (${{ inputs.runner }}${{ startsWith(inputs.runner, 'ubuntu') && format(', {0}', inputs.display == 'wayland' && inputs.compositor || inputs.display) || '' }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    env:
      AUTO_RUN: ${{ inputs.test == 'all' && '1' || '' }}
      AUTO_RUN_TEST_NAME: ${{ inputs.test != 'all' && inputs.test || '' }}
      ELECTROBUN_KITCHEN_MAIN_PROCESS: bun
      ELECTROBUN_KITCHEN_RENDERER: native
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
      - uses: ./.github/actions/install-hutch
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libpipewire-0.3-dev build-essential cmake pkg-config xvfb xauth openbox dbus-x11 hunspell-en-us
      - name: Install the Wayland compositors
        if: runner.os == 'Linux' && inputs.display == 'wayland'
        run: sudo apt-get install -y sway labwc wlr-randr jq grim wl-clipboard wtype
      - name: Build the devkit
        working-directory: package
        run: |
          hutch run install
          hutch build:dev
      - name: Strip the devkit like a release (Linux)
        if: runner.os == 'Linux' && inputs.strip == 'yes'
        working-directory: package
        run: node --input-type=module -e 'const { stripLinuxRelease } = await import("./scripts/strip-linux-release.mjs"); stripLinuxRelease("dist")'
      - name: Install Kitchen
        working-directory: kitchen
        run: hutch run install
      - name: Run the test (Linux, Xvfb + openbox)
        if: runner.os == 'Linux' && inputs.display == 'x11'
        working-directory: kitchen
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: |
          export HUTCH_ELECTROBUN_DEVKIT_ROOT="$GITHUB_WORKSPACE/package/dist"
          dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24' bash -e -c 'openbox > /dev/null 2>&1 & hutch electrobun dev'
      - name: Run the test (Linux, headless Wayland)
        if: runner.os == 'Linux' && inputs.display == 'wayland'
        working-directory: kitchen
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          SCALE: ${{ inputs.scale }}
          COMPOSITOR: ${{ inputs.compositor }}
          EXTRA_ENV: ${{ inputs.env }}
        run: |
          export HUTCH_ELECTROBUN_DEVKIT_ROOT="$GITHUB_WORKSPACE/package/dist"
          read -r -a extra_env <<< "$EXTRA_ENV"
          dbus-run-session -- env "${extra_env[@]}" "$GITHUB_WORKSPACE/.github/scripts/run-under-wayland.sh" \
            --compositor "$COMPOSITOR" --scale "$SCALE" --screenshots "$RUNNER_TEMP/screenshots" -- hutch electrobun dev
      - name: Upload Wayland screenshots
        if: always() && runner.os == 'Linux' && inputs.display == 'wayland'
        uses: actions/upload-artifact@v6
        with:
          name: wayland-screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore
      - name: Appearance (macOS)
        if: runner.os == 'macOS'
        env:
          APPEARANCE: ${{ inputs.appearance }}
          REDUCE_TRANSPARENCY: ${{ inputs.reduce_transparency }}
        run: |
          if [ "$REDUCE_TRANSPARENCY" = off ]; then
            defaults write com.apple.universalaccess reduceTransparency -bool false \
              || sudo defaults write "$HOME/Library/Preferences/com.apple.universalaccess" reduceTransparency -bool false \
              || true
          fi
          if [ "$APPEARANCE" = dark ]; then
            osascript -e 'tell application "System Events" to tell appearance preferences to set dark mode to true' \
              || defaults write -g AppleInterfaceStyle Dark
          fi
          echo "AppleInterfaceStyle: $(defaults read -g AppleInterfaceStyle 2>/dev/null || echo Light)"
          echo "dark mode (System Events): $(osascript -e 'tell application "System Events" to tell appearance preferences to get dark mode' 2>&1)"
          echo "reduceTransparency: $(defaults read com.apple.universalaccess reduceTransparency 2>&1)"
          system_profiler SPDisplaysDataType | grep -E "Chipset|Metal|Resolution" || true
      - name: Run the test (macOS)
        if: runner.os == 'macOS'
        working-directory: kitchen
        env:
          BACKGROUND: ${{ inputs.background }}
        run: |
          export HUTCH_ELECTROBUN_DEVKIT_ROOT="$GITHUB_WORKSPACE/package/dist"
          if [ "$BACKGROUND" = no ]; then
            hutch electrobun dev
            exit
          fi
          # As on a developer's Mac: Finder is frontmost, and nothing in the run
          # may take it over or move the cursor (T758).
          osascript -e 'tell application "Finder" to activate'
          sleep 2
          watch="$RUNNER_TEMP/focus.log"
          "$GITHUB_WORKSPACE/.github/scripts/watch-focus.sh" > "$watch" &
          watcher=$!
          sleep 2
          status=0
          mode=1; [ "$BACKGROUND" = control ] && mode=0
          ELECTROBUN_BACKGROUND=$mode hutch electrobun dev || status=$?
          sleep 1
          kill "$watcher"
          echo "Frontmost app and cursor during the run:"
          cat "$watch"
          changes=$(( $(wc -l < "$watch") - 1 ))
          if [ "$BACKGROUND" = yes ] && [ "$changes" -gt 0 ]; then
            echo "::error::The background run changed the frontmost app or moved the cursor"
            exit 1
          fi
          if [ "$BACKGROUND" = control ] && [ "$changes" -eq 0 ]; then
            echo "::error::Control run: the watcher saw no change in the foreground, so it can't be trusted"
            exit 1
          fi
          exit "$status"
