name: PR checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
      - uses: ./.github/actions/install-hutch
      - name: Install dependencies
        working-directory: package
        run: hutch run install
      - name: Typecheck
        working-directory: package
        run: hutch typecheck
      - name: Build (dev)
        working-directory: package
        run: hutch build:dev
