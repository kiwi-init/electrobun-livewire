name: PR checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
      - uses: ./.github/actions/install-hutch
      - name: Install dependencies
        working-directory: package
        run: hutch run install
      - name: Typecheck
        working-directory: package
        run: hutch typecheck
      # The release scripts' tests, and the pins on this tree: package, kitchen,
      # the npm resolver and the release provenance pins agree, so the sync
      # leaves nothing to change.
      - name: Release scripts and toolchain pins
        working-directory: package
        run: |
          hutch test:version-bump
          node scripts/sync-release-toolchain-pins.mjs
          git diff --exit-code
      # Every symbol each platform's wrapper is bound with must exist in that
      # wrapper: one missing symbol makes bun:ffi reject the whole library (#94).
      - name: Native symbol contract
        working-directory: package
        run: hutch test:native-symbol-contract
      # WKWebView renders at the display's rate, not near 60 fps: the WebKit
      # feature SPI it uses must still exist and take the change.
      - name: macOS rendering rate
        working-directory: package
        run: hutch test:macos-rendering-rate
      - name: Build (dev)
        working-directory: package
        run: hutch build:dev
